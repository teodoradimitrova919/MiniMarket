<article class="listing-card card h-100">
  <a class="listing-card-link" data-listing-link>
    <div class="listing-card-media">
      <div class="listing-card-placeholder" data-image-placeholder>
        <i class="bi" data-placeholder-icon aria-hidden="true"></i>
        <span>No photo yet</span>
      </div>
      <img class="listing-card-image" data-listing-image hidden loading="lazy" decoding="async" alt="">
    </div>
    <div class="card-body">
      <p class="listing-card-category" data-listing-category></p>
      <h3 class="listing-card-title" data-listing-title></h3>
      <p class="listing-card-description" data-listing-description hidden></p>
      <div class="d-flex align-items-center justify-content-between gap-2 mt-3">
        <span class="listing-card-price" data-listing-price></span>
        <span class="btn btn-sm btn-outline-success" data-view-details hidden>View Details</span>
        <span class="listing-card-arrow" aria-hidden="true"><i class="bi bi-arrow-up-right"></i></span>
      </div>
    </div>
  </a>
</article>
