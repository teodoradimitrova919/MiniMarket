<div class="modal listing-modal" id="listing-form-modal" tabindex="-1" aria-labelledby="listing-form-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="listing-form-modal-title"></h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close listing form"></button></div>
    <div class="modal-body" data-modal-form-host></div>
  </div></div>
</div>
<div class="modal listing-modal" id="view-listing-modal" tabindex="-1" aria-labelledby="view-listing-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="view-listing-modal-title">View Listing</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close listing details"></button></div>
    <div class="modal-body" data-modal-details-host></div>
    <div class="modal-footer"><a class="btn btn-outline-success" data-details-page>Open details page</a><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Close</button></div>
  </div></div>
</div>
<div class="modal listing-modal" id="delete-listing-modal" tabindex="-1" aria-labelledby="delete-listing-title" aria-describedby="delete-listing-description" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="delete-listing-title">Delete this listing?</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cancel deletion" data-delete-cancel></button></div>
    <div class="modal-body"><p id="delete-listing-description">Permanently delete <strong data-delete-title></strong>? Its associated favorites will also be removed. This action cannot be undone.</p><p class="alert alert-danger mb-0" data-delete-error role="alert" hidden></p></div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal" data-delete-cancel>Cancel</button><button class="btn btn-danger" type="button" data-confirm-delete>Delete Listing</button></div>
  </div></div>
</div>
