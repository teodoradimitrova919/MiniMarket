<section class="auth-page login-page" aria-labelledby="page-title">
  <div class="auth-layout">
    <aside class="auth-aside">
      <span class="auth-brand-icon"><i class="bi bi-shop" aria-hidden="true"></i></span>
      <p class="eyebrow">Welcome back to MiniMarket</p>
      <h2>Your next great find is waiting.</h2>
      <p>Sign in to manage your listings, keep your favorites close, and make yourself at home.</p>
      <a href="/" class="home-text-link">Explore the marketplace <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></a>
    </aside>
    <div class="auth-form-panel">
      <p class="eyebrow">Good to see you again</p>
      <h1 id="page-title" tabindex="-1">Login</h1>
      <p class="auth-intro">Enter your details to continue.</p>
      <div data-auth-message tabindex="-1" hidden></div>
      <form novalidate aria-label="Login" aria-busy="false">
        <div class="mb-3"><label for="login-email" class="form-label">Email</label><input class="form-control" id="login-email" type="email" name="email" autocomplete="username" required></div>
        <div class="mb-4"><label for="login-password" class="form-label">Password</label><input class="form-control" id="login-password" type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="auth-switch">New to MiniMarket? <a href="/register" data-auth-switch>Create an account</a></p>
    </div>
  </div>
</section>
