<section class="auth-page register-page" aria-labelledby="page-title">
  <div class="auth-layout">
    <aside class="auth-aside">
      <span class="auth-brand-icon"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
      <p class="eyebrow">A place for you here</p>
      <h2>Good finds.<br>New connections.</h2>
      <p>Join the community, discover your next favorite, and give your unused things a new beginning.</p>
      <a href="/" class="home-text-link">Take a look around <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></a>
    </aside>
    <div class="auth-form-panel">
      <p class="eyebrow">Make yourself at home</p>
      <h1 id="page-title" tabindex="-1">Register</h1>
      <p class="auth-intro">Create your MiniMarket account.</p>
      <div data-auth-message tabindex="-1" hidden></div>
      <form novalidate aria-label="Register" aria-busy="false">
        <div class="mb-3"><label for="register-email" class="form-label">Email</label><input class="form-control" id="register-email" type="email" name="email" autocomplete="email" required></div>
        <div class="mb-3"><label for="register-username" class="form-label">Username</label><input class="form-control" id="register-username" type="text" name="username" autocomplete="username" required></div>
        <div class="mb-3"><label for="register-password" class="form-label">Password</label><input class="form-control" id="register-password" type="password" name="password" autocomplete="new-password" minlength="6" aria-describedby="password-help" required><div id="password-help" class="form-text">Use at least 6 characters.</div></div>
        <div class="mb-4"><label for="register-confirm" class="form-label">Confirm password</label><input class="form-control" id="register-confirm" type="password" name="confirmPassword" autocomplete="new-password" minlength="6" required></div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
      </form>
      <p class="auth-switch">Already part of the community? <a href="/login" data-auth-switch>Login</a></p>
    </div>
  </div>
</section>
